@if (layout.sidebarOpen()) {
  <div class="fixed inset-0 z-40 bg-black/40 md:hidden" (click)="layout.closeSidebar()"></div>
}

<aside
  class="fixed inset-y-0 left-0 z-50 w-64 h-screen shrink-0 bg-white border-r border-gray-100 flex flex-col justify-between py-6 px-4 overflow-y-auto transition-transform duration-200 md:static md:z-auto md:w-60 md:translate-x-0"
  [class.translate-x-0]="layout.sidebarOpen()"
  [class.-translate-x-full]="!layout.sidebarOpen()"
>
  <div>
    <!-- Logo -->
    <div class="flex items-center gap-3 px-2 mb-8">
      <div
        class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 flex items-center justify-center shrink-0"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4.5 h-4.5 text-white"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3z"
          />
        </svg>
      </div>
      <div class="leading-tight">
        <p class="text-sm font-semibold text-gray-900">Team Pulse</p>
        <p class="text-xs text-gray-400">Team Workspace</p>
      </div>
    </div>

    <button
      type="button"
      (click)="layout.closeSidebar()"
      aria-label="Close menu"
      class="md:hidden absolute top-5 right-4 p-1 rounded-lg text-gray-400 hover:bg-gray-50 hover:text-gray-700"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <!-- Nav -->
    <nav class="flex flex-col gap-1">
      @for (item of navItems; track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="bg-indigo-50 text-indigo-600"
          (click)="layout.closeSidebar()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition-colors"
        >
          <lucide-icon [img]="item.icon" [size]="18"></lucide-icon>
          {{ item.label }}
          @if (item.link === '/holidays' && pendingCount().length) {
            <span class="ml-auto text-[11px] font-semibold bg-rose-500 text-white rounded-full px-1.5">{{ pendingCount().length }}</span>
          }
        </a>
      }
    </nav>
  </div>

  <!-- Logout -->
  <button
    type="button"
    (click)="logout()"
    class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition-colors text-left"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-4.5 h-4.5"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <polyline points="16 17 21 12 16 7" />
      <line x1="21" y1="12" x2="9" y2="12" />
    </svg>
    Logout
  </button>
</aside>
