<div class="flex gap-3">
  <div
    class="flex flex-col justify-between text-[10px] text-gray-300 h-40 py-0.5"
  >
    <span *ngFor="let t of yTicks">{{ t }}</span>
  </div>

  <div class="flex-1">
    <svg
      [attr.viewBox]="'0 0 ' + width + ' ' + height"
      class="w-full h-40 overflow-visible"
      preserveAspectRatio="none"
    >
      <defs>
        <linearGradient id="lineFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18" />
          <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
        </linearGradient>
      </defs>

      <!-- horizontal gridlines -->
      <line
        *ngFor="let t of yTicks; let i = index"
        x1="0"
        [attr.x2]="width"
        [attr.y1]="padding + (i * (height - padding * 2)) / (yTicks.length - 1)"
        [attr.y2]="padding + (i * (height - padding * 2)) / (yTicks.length - 1)"
        stroke="#F1F2F6"
        stroke-width="1"
      />

      <path [attr.d]="areaPath" fill="url(#lineFill)" stroke="none" />
      <path
        [attr.d]="linePath"
        fill="none"
        stroke="#6366F1"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Hover targets and dots -->
      <g *ngFor="let p of dots; let i = index" 
         (mouseenter)="setHovered(i, data[i])" 
         (mouseleave)="clearHovered()"
         class="cursor-pointer">
        <!-- Invisible larger hover target circle -->
        <circle
          [attr.cx]="p.x"
          [attr.cy]="p.y"
          r="16"
          fill="transparent"
        />
        <!-- Small visual dot -->
        <circle
          [attr.cx]="p.x"
          [attr.cy]="p.y"
          [attr.r]="hoveredIndex === i ? 6 : 3.5"
          [attr.fill]="hoveredIndex === i ? '#4F46E5' : '#6366F1'"
          stroke="white"
          [attr.stroke-width]="hoveredIndex === i ? 2 : 1.5"
          class="transition-all duration-150"
        />
      </g>

      <!-- SVG Tooltip -->
      <g *ngIf="hoveredIndex !== null" class="pointer-events-none">
        <rect
          [attr.x]="dots[hoveredIndex].x - 24"
          [attr.y]="dots[hoveredIndex].y - 32"
          width="48"
          height="22"
          rx="4"
          fill="#1F2937"
          stroke="#4B5563"
          stroke-width="1"
        />
        <text
          [attr.x]="dots[hoveredIndex].x"
          [attr.y]="dots[hoveredIndex].y - 17"
          fill="white"
          font-size="11"
          font-weight="bold"
          text-anchor="middle"
        >
          {{ hoveredValueAnimated }}
        </text>
      </g>
    </svg>

    <div class="flex justify-between mt-2">
      <span *ngFor="let d of data" class="text-[10px] text-gray-400 font-medium">{{
        d.label
      }}</span>
    </div>
  </div>
</div>
