<div class="relative inline-block w-full">
  <button
    type="button"
    (click)="toggle()"
    [disabled]="disabled()"
    class="flex w-full items-center justify-between gap-2 rounded-lg border px-3 py-2 text-sm text-left outline-none transition-colors disabled:opacity-60"
    [class]="invalid ? 'border-rose-400' : open() ? 'border-indigo-400 ring-2 ring-indigo-100' : 'border-gray-200'"
  >
    <span [class]="display ? 'text-gray-800' : 'text-gray-400'">{{ display || placeholder }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 shrink-0">
      <rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" />
    </svg>
  </button>

  @if (open()) {
    <div
      class="absolute z-50 mt-2 max-w-[calc(100vw-1.5rem)] rounded-xl border border-gray-100 bg-white p-3 shadow-lg"
      [class]="(mode === 'month' ? 'w-56' : 'w-64') + ' ' + (alignRight() ? 'right-0' : 'left-0')"
    >
      <div class="flex items-center justify-between mb-2">
        <button type="button" (click)="prev()" class="rounded-md p-1 text-gray-400 hover:bg-gray-50 hover:text-gray-700" aria-label="Previous">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6" /></svg>
        </button>
        <span class="text-sm font-bold text-gray-800">{{ headerLabel }}</span>
        <button type="button" (click)="next()" class="rounded-md p-1 text-gray-400 hover:bg-gray-50 hover:text-gray-700" aria-label="Next">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6" /></svg>
        </button>
      </div>

      @if (mode === 'date') {
        <div class="grid grid-cols-7 gap-y-1 mb-1">
          @for (w of weekdays; track $index) {
            <span class="text-center text-[11px] font-medium text-gray-400">{{ w }}</span>
          }
        </div>
        <div class="grid grid-cols-7 gap-y-1">
          @for (cell of grid; track $index) {
            @if (cell) {
              <button
                type="button"
                (click)="pick(cell)"
                [disabled]="cell.disabled"
                class="h-7 w-7 mx-auto rounded-md text-xs flex items-center justify-center transition-colors"
                [class]="isSelected(cell.iso) ? 'bg-indigo-600 text-white font-semibold' : cell.disabled ? 'text-gray-300 cursor-not-allowed' : isToday(cell.iso) ? 'text-indigo-600 font-semibold hover:bg-indigo-50' : 'text-gray-700 hover:bg-gray-50'"
              >
                {{ cell.day }}
              </button>
            } @else {
              <span></span>
            }
          }
        </div>
      } @else {
        <div class="grid grid-cols-3 gap-1.5">
          @for (m of months; track $index) {
            <button
              type="button"
              (click)="pickMonth($index)"
              [disabled]="monthDisabled($index)"
              class="rounded-md py-2 text-xs font-medium transition-colors"
              [class]="isMonthSelected($index) ? 'bg-indigo-600 text-white' : monthDisabled($index) ? 'text-gray-300 cursor-not-allowed' : 'text-gray-700 hover:bg-gray-50'"
            >
              {{ m }}
            </button>
          }
        </div>
      }
    </div>
  }
</div>
